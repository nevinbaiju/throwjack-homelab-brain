<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0E1115; --surface:#151A21; --raise:#1C222B;
    --ink:#E3E8F0; --ink-2:#9CA6B6; --ink-3:#6E7889;
    --rule:#262E39; --accent:#7FB3DB; --accent-ink:#0E1115;
    --signal:#DD8A4E; --ok:#74B893;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ground:#F1F3F7; --surface:#FFFFFF; --raise:#E8ECF3;
      --ink:#12161C; --ink-2:#4C5666; --ink-3:#6E7889;
      --rule:#D2D8E2; --accent:#17486B; --accent-ink:#FFFFFF;
      --signal:#A84C1B; --ok:#2C6247;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;padding-inline:20px;
       padding-block:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:720px;margin-inline:auto;display:flex;flex-direction:column;
        flex:1;min-height:0;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--cond);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;margin:0}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .modes{display:flex;gap:2px;background:var(--raise);padding:3px;border-radius:8px;
         border:1px solid var(--rule);width:fit-content}
  .modes button{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;padding:7px 14px;border:0;border-radius:6px;cursor:pointer;
    background:transparent;color:var(--ink-2)}
  .modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .modes button:focus-visible,textarea:focus-visible,#send:focus-visible,#slug:focus-visible{
    outline:2px solid var(--signal);outline-offset:2px}
  #slugrow{display:none;gap:8px;align-items:center}
  #slugrow.on{display:flex}
  #slugrow label{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  #slug{flex:1;min-width:0;font-family:var(--mono);font-size:14px;padding:8px 10px;
    background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px}
  textarea{flex:1;min-height:180px;resize:none;width:100%;padding:16px;
    background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;
    font-family:var(--sans);font-size:17px;line-height:1.55}
  textarea::placeholder{color:var(--ink-3)}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #send{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;padding:11px 22px;border:0;border-radius:8px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink)}
  #send[disabled]{opacity:.5;cursor:default}
  #status{font-family:var(--mono);font-size:12.5px;color:var(--ok);min-height:1.2em;
    opacity:0;transition:opacity .18s}
  #status.show{opacity:1}
  #status.err{color:var(--signal)}
  #recent{border-top:1px solid var(--rule);padding-top:10px;margin:0;list-style:none;
    font-family:var(--mono);font-size:12px;color:var(--ink-3);
    max-height:22vh;overflow-y:auto}
  .linkish{background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-decoration:underline}
  .linkish:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  #recent li{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Board */
  /* Columns on a wide screen, one stack on a phone. auto-fit + minmax does
     both without a breakpoint, and the wrapper widens only for these tabs so
     the composer keeps its comfortable reading measure. */
  .wrap.wide{max-width:1240px}
  #today{display:none;flex:1;min-height:0;overflow-y:auto}
  #today.on{display:block;max-width:640px;width:100%;margin:0 auto}
  #today .pick{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;
    border-bottom:1px solid var(--line)}
  /* 24px hit target minimum: this gets tapped one-handed, half asleep. */
  #today .pick input{width:22px;height:22px;margin-top:2px;flex:none}
  #today .pick .t{font-weight:600}
  #today .pick .why{opacity:.72;font-size:.9em;margin-top:2px}
  #today .mut{font-size:.85em;margin-top:4px;opacity:.85}
  #today .mut b{font-weight:600}
  #today .notpicked{opacity:.6;font-size:.9em;margin:14px 4px}
  #today textarea{width:100%;min-height:76px;margin-top:14px}
  #today .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  #today .spin{opacity:.7;margin:18px 4px}
  #today .warn{color:#b45309;font-size:.85em;margin:8px 4px}
  #board,#lists{display:none;flex:1;min-height:0;overflow-y:auto}
  #board.on,#lists.on{display:grid;gap:16px;align-items:start;
    grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
  #lists.one{grid-template-columns:minmax(0,560px)}
  .lane{background:var(--raise);border:1px solid var(--rule);border-radius:11px;padding:12px}
  .lane h2{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .lane h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .lane ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);
    border:1px solid var(--rule);border-radius:9px}
  .task.pin{border-color:var(--signal)}
  .task.gone{opacity:.35}
  .tick{appearance:none;flex:none;width:17px;height:17px;margin-top:2px;cursor:pointer;
    border:1.5px solid var(--ink-3);border-radius:5px;background:transparent}
  .tick:checked{background:var(--ok);border-color:var(--ok)}
  .tick:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .task .body{min-width:0;flex:1}
  .task .t{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
  .task.done-row .t{text-decoration:line-through;color:var(--ink-3)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;
    display:flex;gap:10px;flex-wrap:wrap}
  .meta .p1{color:var(--signal);font-weight:500}
  .acts{display:flex;gap:4px;flex:none}
  .acts button{font-family:var(--mono);font-size:10.5px;padding:3px 7px;cursor:pointer;
    background:var(--raise);color:var(--ink-2);border:1px solid var(--rule);border-radius:5px}
  .acts button:hover{color:var(--ink)}
  .acts button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .empty{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:2px 0}
  /* display lives here, not inline: an inline style beats .on and the row
     would never appear no matter what the class said. */
  /* One add row per list, sitting inside that list's card. A global bar with a
     store picker made you name the list twice: once by looking at it, once in
     a dropdown. */
  .addrow{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
  .addrow input{flex:1;min-width:0;font-size:14px;padding:7px 9px;background:var(--surface);
    color:var(--ink);border:1px solid var(--rule);border-radius:7px}
  .addrow input::placeholder{color:var(--ink-3)}
  .addrow button{flex:none;width:34px;font-size:17px;line-height:1;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px}
  .addrow input:focus-visible,.addrow button:focus-visible{
    outline:2px solid var(--signal);outline-offset:2px}
  .lane h2 .kill{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 7px;
    cursor:pointer;background:transparent;color:var(--ink-3);border:1px solid var(--rule);
    border-radius:5px}
  .lane h2 .kill:hover{color:var(--signal);border-color:var(--signal)}
  .cad{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}
  .cad button{font-family:var(--mono);font-size:10.5px;margin-left:8px;padding:2px 6px;
    cursor:pointer;background:var(--raise);color:var(--ink-2);
    border:1px solid var(--rule);border-radius:5px}
  .cadedit{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .cadedit input,.cadedit select{font-family:var(--mono);font-size:12px;padding:5px 7px;
    background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px}
  .cadedit input.rep{flex:1;min-width:120px}
  .cadedit .save{background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;
    font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;padding:6px 12px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Brain</h1>
    <span class="hint"><span id="kbd">⌘↵ to send</span> ·
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="linkish">sign out</button>
      </form></span>
  </header>

  <div class="modes" role="tablist">
    <button role="tab" id="m-today" aria-selected="false">Today</button>
    <button role="tab" id="m-file" aria-selected="true">File task</button>
    <button role="tab" id="m-plan" aria-selected="false">Plan task</button>
    <button role="tab" id="m-board" aria-selected="false">Board</button>
    <button role="tab" id="m-upkeep" aria-selected="false">Upkeep</button>
    <button role="tab" id="m-shop" aria-selected="false">Groceries</button>
  </div>

  <div id="slugrow">
    <label for="slug">project</label>
    <input id="slug" list="slugs" placeholder="doordash" autocomplete="off" autocapitalize="off" spellcheck="false">
    <datalist id="slugs"></datalist>
  </div>

  <textarea id="text" autofocus
    placeholder="One thing. It lands on disk before anything reads it."></textarea>

  <div class="bar">
    <button id="send">Send</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <ul id="recent" aria-label="recent captures"></ul>
  <div id="board" aria-label="board"></div>
  <div id="lists" aria-label="lists"></div>
  <div id="today" aria-label="today"></div>
</div>

<script>
// No token here: the signed session cookie authenticates these fetches,
// and it is httponly so this script cannot read or leak it.
const H = {};
const $ = id => document.getElementById(id);
let mode = 'file';

$('kbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘↵ to send' : 'Ctrl+↵ to send';

const TABS = {today:'m-today', file:'m-file', plan:'m-plan', board:'m-board', upkeep:'m-upkeep', shop:'m-shop'};

function setMode(next){
  mode = next;
  const composing = next === 'file' || next === 'plan';
  // Guarded: a tab button that is not in the markup must not take the
  // whole page down with it.
  for (const [k, id] of Object.entries(TABS)){
    const el = $(id); if (el) el.setAttribute('aria-selected', k === next);
  }
  $('slugrow').classList.toggle('on', next === 'plan');
  // The composer, the board and the lists share the column; one at a time.
  for (const id of ['text','recent']) $(id).style.display = composing ? '' : 'none';
  document.querySelector('.bar').style.display = composing ? '' : 'none';
  document.querySelector('.wrap').classList.toggle('wide', !composing);
  $('today').classList.toggle('on', next === 'today');
  $('board').classList.toggle('on', next === 'board');
  $('lists').classList.toggle('on', next === 'upkeep' || next === 'shop');
  $('lists').classList.toggle('one', next === 'upkeep');
  if (next === 'today'){ renderToday(); return; }
  if (next === 'board'){ loadBoard(); return; }
  if (next === 'upkeep' || next === 'shop'){
    loadLists(next);
    return;
  }
  $('text').placeholder = next === 'plan'
    ? 'Everything you know about this project. Messy is fine — it gets broken into ordered steps, and your raw text is kept verbatim.'
    : 'One thing. It lands on disk before anything reads it.';
  $('text').focus();
}
for (const [name, id] of Object.entries(TABS)){
  const el = $(id);
  if (el) el.onclick = () => setMode(name);
  else console.warn('tab button missing:', id);
}

const LANE_LABEL = {today:'Today', in_progress:'In progress', backlog:'Backlog', waiting:'Waiting', done:'Done'};

function esc(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

function metaLine(t){
  const bits = [];
  if (t.pinned) bits.push('<span class="p1">P0</span>');
  else if (t.priority === 1) bits.push('<span class="p1">!!!</span>');
  if (t.project) bits.push(esc(t.project));
  if (t.estimate_min) bits.push(esc(t.estimate_min) + 'm');
  if (t.due) bits.push('due ' + esc(t.due));
  if (t.why) bits.push(esc(t.why));
  return bits.join('<span aria-hidden="true">·</span>');
}

async function act(id, verb, li){
  const lane = li.closest('.lane');
  const ul = li.parentNode, next = li.nextSibling;
  li.remove();                                    // optimistic; put back on failure
  bumpCount(lane, -1);
  try{
    const r = await fetch('/task/' + encodeURIComponent(id) + '/' + verb, {method:'POST', headers:H});
    if(!r.ok) throw new Error(r.status);
    // The task moved lane, so the cached board is wrong in a way we cannot
    // patch locally without duplicating the lane rules. Drop it and let the
    // next visit refetch; the DOM is already correct for right now.
    CACHE.board = null;
    say(verb === 'done' ? 'done' : verb);
  }catch(e){
    ul.insertBefore(li, next);
    bumpCount(lane, +1);
    const tick = li.querySelector('.tick');
    if (tick) tick.checked = false;
    say('could not update — ' + e.message, true);
  }
}

function cadenceText(c){
  if (!c) return 'added on the phone — cadence lives in Reminders';
  return c.repeat + (c.at ? ' at ' + c.at : '') + (c.day ? ' · ' + c.day : '');
}

const DAYS = ['','monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

async function saveCadence(uid, li){
  const repeat = li.querySelector('.rep').value.trim();
  const at = li.querySelector('.at').value.trim();
  const day = li.querySelector('.day').value;
  if (!repeat) return say('repeat cannot be empty', true);
  try{
    const r = await fetch('/upkeep/' + encodeURIComponent(uid) + '/cadence',
      {method:'POST', headers:{...H,'Content-Type':'application/json'},
       body: JSON.stringify({repeat, at, day})});
    if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || r.status); }
    say('cadence updated'); loadLists('upkeep');
  }catch(e){ say('could not update — ' + e.message, true); }
}

// Optimistic list edits. The DOM changes first and the request follows; a
// failure puts the row back and says so. Waiting on CalDAV before showing the
// result made every tick feel broken even when it worked.
function bumpCount(lane, delta){
  const n = lane && lane.querySelector('h2 .n');
  if (n) n.textContent = Math.max(0, (parseInt(n.textContent, 10) || 0) + delta);
}

function wireTick(li, coll){
  const tick = li.querySelector('.tick');
  if (!tick) return;
  tick.onchange = async () => {
    if (!tick.checked) return;
    const lane = li.closest('.lane');
    const ul = li.parentNode, next = li.nextSibling;
    li.remove();
    bumpCount(lane, -1);
    if (!ul.children.length) ul.innerHTML = '<li class="empty">empty</li>';
    try{
      const r = await fetch('/list/' + encodeURIComponent(coll) + '/' +
                            encodeURIComponent(li.dataset.uid) + '/done',
                            {method:'POST', headers:H});
      if(!r.ok) throw new Error(r.status);
      const shop = shopOf(coll);
      if (shop) shop.items = shop.items.filter(i => i.uid !== li.dataset.uid);
    }catch(e){
      const ph = ul.querySelector('.empty'); if (ph) ph.remove();
      ul.insertBefore(li, next);
      tick.checked = false;
      bumpCount(lane, +1);
      say('could not tick — ' + e.message, true);
    }
  };
}

function itemRow(uid, summary){
  const li = document.createElement('li');
  li.className = 'task';
  if (uid) li.dataset.uid = uid;
  li.innerHTML = '<input class="tick" type="checkbox" aria-label="tick off ' + esc(summary) + '">' +
                 '<div class="body"><div class="t">' + esc(summary) + '</div></div>';
  return li;
}

// Last good payload, kept in memory. A tab switch paints this immediately and
// then revalidates; without it every switch was a blank 0.6s while CalDAV was
// asked the same question again. Mutations update it alongside the DOM so the
// two never disagree, and the revalidation catches anything changed elsewhere.
const CACHE = {lists:null, board:null};

function shopOf(coll){
  return (CACHE.lists && CACHE.lists.shopping || []).find(s => s.collection === coll);
}

async function loadLists(which){
  if (CACHE.lists) renderLists(which, CACHE.lists);
  else $('lists').innerHTML = '<p class="empty">loading…</p>';
  try{
    const r = await fetch('/lists.json', {headers:H});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const changed = JSON.stringify(data) !== JSON.stringify(CACHE.lists);
    CACHE.lists = data;
    if (changed && (mode === 'upkeep' || mode === 'shop')) renderLists(mode, data);
  }catch(e){
    if (!CACHE.lists) $('lists').innerHTML = '<p class="empty">could not load — ' + esc(e.message) + '</p>';
    else say('could not refresh — ' + e.message, true);
  }
}

function renderLists(which, data){
  const out = [];
  if (which === 'upkeep'){
    const items = data.upkeep || [];
    out.push('<section class="lane"><h2>Upkeep<span class="n">' + items.length + '</span></h2><ul>');
    if (!items.length) out.push('<li class="empty">nothing due</li>');
    for (const i of items){
      const c = i.cadence;
      out.push('<li class="task" data-uid="' + esc(i.uid) + '">' +
        '<div class="body"><div class="t">' + esc(i.summary) + '</div>' +
        '<div class="cad">' + esc(cadenceText(c)) +
          (c ? '<button data-edit="1">edit</button>' : '') + '</div>' +
        (c ? '<div class="cadedit" hidden>' +
              '<input class="rep" value="' + esc(c.repeat) + '" aria-label="repeat" ' +
                'placeholder="daily · weekly · monthly · every 2 weeks">' +
              '<input class="at" type="time" value="' + esc(c.at) + '" aria-label="time">' +
              '<select class="day" aria-label="weekday">' +
                DAYS.map(d => '<option value="' + d + '"' + (d === c.day ? ' selected' : '') + '>' +
                              (d || 'any day') + '</option>').join('') +
              '</select><button class="save">Save</button></div>' : '') +
        '</div></li>');
    }
    out.push('</ul><p class="empty">tick these off in Reminders — iOS owns the recurrence</p></section>');
  } else {
    for (const shop of data.shopping || []){
      out.push('<section class="lane" data-coll="' + esc(shop.collection) + '"><h2>' + esc(shop.label) +
               '<span class="n">' + shop.items.length + '</span>' +
               '<button class="kill" title="delete this list">×</button></h2><ul>');
      if (!shop.items.length) out.push('<li class="empty">empty</li>');
      for (const i of shop.items){
        out.push('<li class="task" data-uid="' + esc(i.uid) + '">' +
          '<input class="tick" type="checkbox" aria-label="tick off ' + esc(i.summary) + '">' +
          '<div class="body"><div class="t">' + esc(i.summary) + '</div></div></li>');
      }
      out.push('</ul>' +
        '<form class="addrow" data-coll="' + esc(shop.collection) + '">' +
          '<input placeholder="add to ' + esc(shop.label) + '" aria-label="add to ' + esc(shop.label) + '" autocomplete="off">' +
          '<button type="submit" title="add">+</button>' +
        '</form></section>');
    }
    out.push('<section class="lane"><h2>New list</h2>' +
             '<form id="newlist"><div class="cadedit">' +
             '<input class="rep" id="newname" placeholder="Trader Joe\'s" aria-label="list name">' +
             '<button class="save">Create</button></div></form></section>');
  }
  $('lists').innerHTML = out.join('');

  $('lists').querySelectorAll('.task[data-uid]').forEach(li => {
    const lane = li.closest('.lane');
    if (lane && lane.dataset.coll) wireTick(li, lane.dataset.coll);
  });

  // cadence edit toggles and saves
  $('lists').querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => { const box = b.closest('.body').querySelector('.cadedit'); box.hidden = !box.hidden; };
  });
  $('lists').querySelectorAll('.cadedit .save').forEach(b => {
    const li = b.closest('.task');
    if (li) b.onclick = () => saveCadence(li.dataset.uid, li);
  });

  // add an item, from inside the list it belongs to
  $('lists').querySelectorAll('form.addrow').forEach(f => {
    f.onsubmit = async ev => {
      ev.preventDefault();
      const input = f.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const lane = f.closest('.lane'), ul = lane.querySelector('ul');
      const ph = ul.querySelector('.empty'); if (ph) ph.remove();
      const li = itemRow(null, text);
      ul.appendChild(li);
      bumpCount(lane, +1);
      input.focus();                                  // adding one usually means adding two
      try{
        const r = await fetch('/list/' + encodeURIComponent(f.dataset.coll) + '/add',
          {method:'POST', headers:{...H,'Content-Type':'text/plain'}, body:text});
        if(!r.ok) throw new Error(r.status);
        const d = await r.json();
        li.dataset.uid = d.uid;                       // only now can it be ticked
        wireTick(li, f.dataset.coll);
        const shop = shopOf(f.dataset.coll);
        if (shop) shop.items.push({uid:d.uid, summary:text, description:''});
      }catch(e){
        li.remove();
        bumpCount(lane, -1);
        if (!ul.children.length) ul.innerHTML = '<li class="empty">empty</li>';
        input.value = text;
        say('could not add — ' + e.message, true);
      }
    };
  });

  // delete a whole list
  $('lists').querySelectorAll('.kill').forEach(b => {
    const sec = b.closest('.lane');
    b.onclick = async () => {
      const label = sec.querySelector('h2').childNodes[0].textContent.trim();
      if (!confirm('Delete the "' + label + '" list and everything in it? This cannot be undone.')) return;
      const parent = sec.parentNode, next = sec.nextSibling;
      sec.remove();
      try{
        const r = await fetch('/lists/' + encodeURIComponent(sec.dataset.coll), {method:'DELETE', headers:H});
        if(!r.ok) throw new Error(r.status);
        if (CACHE.lists) CACHE.lists.shopping =
          CACHE.lists.shopping.filter(x => x.collection !== sec.dataset.coll);
      }catch(e){
        parent.insertBefore(sec, next);
        say('could not delete — ' + e.message, true);
      }
    };
  });

  const nl = $('newlist');
  if (nl) nl.onsubmit = async ev => {
    ev.preventDefault();
    const name = $('newname').value.trim();
    if (!name) return;
    $('newname').value = '';
    try{
      const r = await fetch('/lists/add', {method:'POST', headers:{...H,'Content-Type':'text/plain'}, body:name});
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      // Render from the response. Refetching all eight collections to learn
      // one name we already have is why a new list took a reload to appear.
      if (CACHE.lists){
        if (!shopOf(d.collection))
          CACHE.lists.shopping.push({collection:d.collection, label:d.label, items:[]});
        CACHE.lists.shopping.sort((a,b) => a.label.toLowerCase() < b.label.toLowerCase() ? -1 : 1);
        renderLists('shop', CACHE.lists);
      }
      say('list created');
    }catch(e){ $('newname').value = name; say('could not create — ' + e.message, true); }
  };
}


async function loadBoard(){
  if (CACHE.board) renderBoard(CACHE.board);
  else $('board').innerHTML = '<p class="empty">loading…</p>';
  try{
    const r = await fetch('/board.json', {headers:H});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const changed = JSON.stringify(data) !== JSON.stringify(CACHE.board);
    CACHE.board = data;
    if (changed && mode === 'board') renderBoard(data);
  }catch(e){
    if (!CACHE.board) $('board').innerHTML = '<p class="empty">could not load the board — ' + esc(e.message) + '</p>';
    else say('could not refresh — ' + e.message, true);
  }
}

function renderBoard(data){
  const out = [];
  for (const lane of data.order){
    const items = data.lanes[lane] || [];
    if (!items.length && lane !== 'in_progress') continue;   // in progress is worth showing empty
    out.push('<section class="lane"><h2>' + esc(LANE_LABEL[lane] || lane) +
             '<span class="n">' + items.length + '</span></h2><ul>');
    if (!items.length) out.push('<li class="empty">nothing here</li>');
    for (const t of items){
      const isDone = lane === 'done';
      out.push(
        '<li class="task' + (t.pinned ? ' pin' : '') + (isDone ? ' done-row' : '') + '" data-id="' + esc(t.id) + '">' +
          '<input class="tick" type="checkbox" ' + (isDone ? 'checked disabled' : '') +
            ' aria-label="complete ' + esc(t.title) + '">' +
          '<div class="body"><div class="t">' + esc(t.title) + '</div>' +
            '<div class="meta">' + metaLine(t) + '</div></div>' +
          (isDone ? '' :
            '<div class="acts">' +
              (lane === 'in_progress' ? '' : '<button data-verb="doing" title="move to In progress">start</button>') +
              (lane === 'waiting' ? '' : '<button data-verb="blocked" title="move to Waiting">wait</button>') +
              '<button data-verb="drop" title="archive">drop</button>' +
            '</div>') +
        '</li>');
    }
    out.push('</ul></section>');
  }
  $('board').innerHTML = out.join('');

  $('board').querySelectorAll('.task').forEach(li => {
    const id = li.dataset.id;
    const tick = li.querySelector('.tick');
    if (tick && !tick.disabled) tick.onchange = () => tick.checked && act(id, 'done', li);
    li.querySelectorAll('.acts button').forEach(b => { b.onclick = () => act(id, b.dataset.verb, li); });
  });
}

function say(msg, bad){
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('err', !!bad);
  s.classList.add('show');
  clearTimeout(say.t);
  say.t = setTimeout(() => s.classList.remove('show'), 2600);
}

async function loadRecent(){
  try{
    const r = await fetch('/inbox/today', {headers: H});
    if(r.status === 401 || r.redirected){ location.href = '/login'; return; }
    if(!r.ok) return;
    const lines = (await r.text()).trim().split('\n').filter(l => l.trim() && !l.startsWith('nothing'));
    $('recent').innerHTML = lines.slice(-6).reverse()
      .map(l => '<li>' + l.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</li>').join('');
  }catch(e){}
}

async function loadProjects(){
  try{
    const r = await fetch('/projects', {headers: H});
    if(!r.ok) return;
    const slugs = await r.json();
    $('slugs').innerHTML = slugs.map(s => '<option value="' + s + '">').join('');
  }catch(e){}
}

async function send(){
  const body = $('text').value.trim();
  if(!body) return;
  const slug = $('slug').value.trim();
  if(mode === 'plan' && !slug){ say('name the project first', true); $('slug').focus(); return; }

  // Clear immediately. Reading a confirmation is where the next thought dies.
  $('text').value = '';
  $('text').focus();
  $('send').disabled = true;

  const url = mode === 'plan' ? '/project/' + encodeURIComponent(slug) + '/dump' : '/capture';
  if(mode === 'plan') say('planning… this takes up to a minute');

  try{
    const r = await fetch(url, {method:'POST', headers:{...H, 'Content-Type':'text/plain'}, body});
    if(!r.ok) throw new Error(await r.text());
    if(mode === 'plan'){
      const d = await r.json();
      say('planned: ' + d.created + ' steps, ' + d.started + ' started');
      loadProjects();
    } else {
      say('caught');
      loadRecent();
    }
  }catch(e){
    // Never lose it: put the text back so you can retry or copy it out.
    $('text').value = body;
    say('failed — your text is still here', true);
  }finally{
    $('send').disabled = false;
  }
}

$('send').onclick = send;
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});
loadRecent(); loadProjects();
// ----------------------------------------------------------------- today ---
// Planning is on demand. Nothing is generated on a schedule, because a plan
// that has been sitting there since morning is one you have already learned
// to scroll past. You ask, it thinks for a few seconds, you argue with it,
// and only then does anything move.
let JOB = null;        // the draft under discussion
let POLL = null;

function todayShell(inner){ $('today').innerHTML = inner; }

async function renderToday(){
  if (JOB && JOB.proposal){ (JOB.kind === 'update' ? renderUpdate : renderDraft)(); return; }
  let d = null;
  try {
    const r = await fetch('/plan/today.json', {headers:H});
    if (r.ok) d = await r.json();
  } catch (e) { /* offline */ }
  if (!d){ todayShell('<p class="empty">could not load</p>'); return; }

  // A day is a DATE, not a row count. Unfinished items stay in the today
  // lane on purpose, so "the lane is non-empty" kept the previous day's plan
  // on screen every morning and the planning page never came back.
  if (d.is_current){
    todayShell('<h2>Today</h2>' +
      d.today.map(t => '<div class="pick"><div><div class="t">' + esc(t.title) + '</div>' +
        (t.blocked_on ? '<div class="why">⛔ ' + esc(t.blocked_on) + '</div>' : '') +
        '</div></div>').join('') +
      '<textarea id="say" placeholder="what happened?"></textarea>' +
      '<div class="row"><button id="upd">Update</button>' +
      '<button id="mkplan" class="linkish">Re-plan the whole day</button></div>');
    $('upd').onclick = sendUpdate;
    $('mkplan').onclick = () => startDraft([], '');
    $('say').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') sendUpdate();
    });
    return;
  }

  // New day. Yesterday's unfinished work leads the list -- it is the most
  // likely thing to still matter, and burying it under the backlog is how it
  // gets silently dropped.
  let out = '<h2>Plan today</h2>';
  if (d.planned_on)
    out += '<div class="notpicked">Last planned ' + esc(d.planned_on) + '.</div>';
  const rows = [];
  if (d.today.length) rows.push(['Carried over', d.today, true]);
  const doing = d.pool.filter(t => t.lane === 'in_progress');
  const back  = d.pool.filter(t => t.lane === 'backlog');
  if (doing.length) rows.push(['In progress', doing, false]);
  if (back.length)  rows.push(['Backlog', back, false]);
  if (!rows.length) out += '<p class="empty">Nothing in progress or backlog.</p>';
  for (const [label, items] of rows){
    out += '<div class="notpicked"><b>' + esc(label) + '</b></div>';
    for (const t of items){
      out += '<label class="pick"><input type="checkbox" value="' + esc(t.id) + '">' +
             '<div><div class="t">' + esc(t.title) + '</div>' +
             (t.carried_from ? '<div class="why">carried from ' + esc(t.carried_from) + '</div>' : '') +
             (t.blocked_on ? '<div class="why">⛔ ' + esc(t.blocked_on) + '</div>' : '') +
             '</div></label>';
    }
  }
  out += '<textarea id="say" placeholder="anything else for today, or leave empty and let it choose"></textarea>' +
         '<div class="row"><button id="mkplan">Plan my day</button></div>';
  todayShell(out);
  const go = () => startDraft(
    Array.from(document.querySelectorAll('#today input[type=checkbox]'))
         .filter(c => c.checked).map(c => c.value),
    ($('say').value || '').trim());
  $('mkplan').onclick = go;
  $('say').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') go();
  });
}

async function startDraft(selected, message){
  todayShell('<p class="spin">Thinking…</p>');
  try {
    const r = await fetch('/plan/draft', {method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, H),
      body: JSON.stringify({selected: selected || [], message: message || ''})});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    waitFor(d.job, j => { JOB = j; renderDraft(); });
  } catch (e) {
    todayShell('<p class="empty">could not start — ' + esc(e.message) + '</p>');
  }
}

function waitFor(jobId, onDone){
  clearInterval(POLL);
  const t0 = Date.now();
  POLL = setInterval(async () => {
    const secs = Math.round((Date.now() - t0) / 1000);
    try {
      const r = await fetch('/plan/job/' + encodeURIComponent(jobId), {headers:H});
      if (!r.ok) throw new Error(await r.text());
      const j = await r.json();
      if (j.state === 'done'){
        clearInterval(POLL); onDone(j); return;
      }
      if (j.state === 'failed'){
        clearInterval(POLL);
        todayShell('<p class="empty">planner failed — ' + esc(j.error || '') + '</p>' +
          '<div class="row"><button id="mkplan">Try again</button></div>');
        // Bare reference would hand the click event in as `selected`.
        $('mkplan').onclick = () => renderToday(); return;
      }
      // Say how long it has been. A spinner with no number is how you end up
      // wondering whether the worker is even running.
      todayShell('<p class="spin">Thinking… ' + secs + 's</p>');
    } catch (e) {
      clearInterval(POLL);
      todayShell('<p class="empty">lost the job — ' + esc(e.message) + '</p>');
    }
  }, 1000);
}

function mutLine(m){
  if (m.op === 'retitle')
    return '<div class="mut">↻ <b>retitle</b> — “' + esc(m.was || '') + '” → “' + esc(m.title) + '”</div>';
  if (m.op === 'set_blocked')
    return '<div class="mut">⛔ <b>blocked on</b> ' + esc(m.blocked_on) + '</div>';
  if (m.op === 'clear_blocked')
    return '<div class="mut">✓ <b>unblocked</b></div>';
  if (m.op === 'set_lane')
    return '<div class="mut">→ <b>move to</b> ' + esc(m.lane) + '</div>';
  if (m.op === 'note_append')
    return '<div class="mut">＋ <b>note</b> ' + esc(m.text) + '</div>';
  return '';
}

function renderDraft(){
  const p = JOB.proposal || {today:[], mutations:[], notes:''};
  const byTask = {};
  for (const m of (p.mutations || [])) (byTask[m.task_id] = byTask[m.task_id] || []).push(m);

  // Tasks it is CREATING for today are part of the day too -- showing them
  // only under "also changes" made the list look short and wrong.
  const newToday = (p.mutations || []).filter(m => m.op === 'add' && m.lane === 'today');
  let out = '<h2>Today</h2>';
  if (!p.today.length && !newToday.length)
    out += '<p class="empty">It picked nothing. Tell it why that is wrong.</p>';
  for (const m of newToday){
    out += '<div class="pick"><div><div class="t">' + esc(m.title) + '</div>' +
           '<div class="why">new task</div></div></div>';
  }
  for (const i of p.today){
    out += '<label class="pick"><input type="checkbox" checked value="' + esc(i.task_id) + '">' +
           '<div><div class="t">' + esc(i.title) + '</div>' +
           '<div class="why">' + esc(i.why) + '</div>' +
           (byTask[i.task_id] || []).map(mutLine).join('') +
           '</div></label>';
  }
  // Mutations on tasks that are NOT in today still change the board, so they
  // must be visible rather than buried.
  const other = (p.mutations || []).filter(m =>
    !(m.op === 'add' && m.lane === 'today') &&
    !p.today.some(i => i.task_id === m.task_id));
  if (other.length) out += '<div class="notpicked"><b>Also changes:</b>' + other.map(mutLine).join('') + '</div>';
  if (p.notes) out += '<div class="notpicked">' + esc(p.notes) + '</div>';
  if ((JOB.rejected || []).length)
    out += '<div class="warn">dropped: ' + esc(JOB.rejected.join('; ')) + '</div>';

  out += '<textarea id="say" placeholder="anything else it should know"></textarea>' +
         '<div class="row"><button id="accept">Accept</button>' +
         '<button id="again" class="linkish">Send</button>' +
         '<button id="nomut" class="linkish">Accept, skip changes</button></div>';
  todayShell(out);

  $('accept').onclick = () => applyDraft(false);
  $('nomut').onclick  = () => applyDraft(true);
  $('again').onclick  = sendRevision;
  $('say').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') sendRevision();
  });
}

async function sendRevision(){
  const msg = ($('say').value || '').trim();
  if (!msg) { $('say').focus(); return; }
  todayShell('<p class="spin">Rethinking…</p>');
  try {
    const r = await fetch('/plan/revise', {method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, H),
      body: JSON.stringify({parent: JOB.id, message: msg})});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    waitFor(d.job, j => { JOB = j; renderDraft(); });
  } catch (e) {
    todayShell('<p class="empty">could not send — ' + esc(e.message) + '</p>');
  }
}

async function applyDraft(skipMutations){
  const accept = Array.from(document.querySelectorAll('#today input[type=checkbox]'))
                      .filter(c => c.checked).map(c => c.value);
  todayShell('<p class="spin">Applying…</p>');
  try {
    const r = await fetch('/plan/apply', {method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, H),
      body: JSON.stringify({job: JOB.id, accept: accept,
                            skip_mutations: !!skipMutations})});
    if (!r.ok) throw new Error(await r.text());
    JOB = null;
    CACHE.board = null;          // the board changed under it
    renderToday();
  } catch (e) {
    todayShell('<p class="empty">could not apply — ' + esc(e.message) + '</p>');
  }
}

async function sendUpdate(){
  const msg = ($('say').value || '').trim();
  if (!msg) { $('say').focus(); return; }
  todayShell('<p class="spin">Working out what changed…</p>');
  try {
    const r = await fetch('/plan/update', {method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, H),
      body: JSON.stringify({message: msg})});
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    waitFor(d.job, j => { JOB = j; renderUpdate(); });
  } catch (e) {
    todayShell('<p class="empty">could not send — ' + esc(e.message) + '</p>');
  }
}

function updLine(m){
  if (m.op === 'complete')    return '✓ done — ' + esc(m.title || m.task_id);
  if (m.op === 'from_today')  return '→ off today — ' + esc(m.title || m.task_id);
  if (m.op === 'to_today')    return '★ onto today — ' + esc(m.title || m.task_id);
  if (m.op === 'add')         return '＋ new in ' + esc(m.lane) + ' — ' + esc(m.title);
  if (m.op === 'set_blocked') return '⛔ blocked on ' + esc(m.blocked_on) + ' — ' + esc(m.title || m.task_id);
  if (m.op === 'clear_blocked') return '✓ unblocked — ' + esc(m.title || m.task_id);
  if (m.op === 'retitle')     return '↻ “' + esc(m.was || '') + '” → “' + esc(m.title) + '”';
  if (m.op === 'set_lane')    return '→ ' + esc(m.lane) + ' — ' + esc(m.title || m.task_id);
  if (m.op === 'note_append') return '＋ note — ' + esc(m.text);
  return esc(m.op);
}

function renderUpdate(){
  const p = JOB.proposal || {mutations:[], notes:''};
  if (!p.mutations.length){
    todayShell('<p class="empty">Nothing to change.' +
      (p.notes ? ' ' + esc(p.notes) : '') + '</p>' +
      ((JOB.rejected||[]).length ? '<div class="warn">' + esc(JOB.rejected.join('; ')) + '</div>' : '') +
      '<div class="row"><button id="back">Back</button></div>');
    $('back').onclick = () => { JOB = null; renderToday(); };
    return;
  }
  // Each change is individually tickable: one wrong reading of your message
  // should not cost you the other five.
  let out = '<h2>About to change</h2>';
  p.mutations.forEach((m, i) => {
    out += '<label class="pick"><input type="checkbox" checked value="' + i + '">' +
           '<div><div class="t">' + updLine(m) + '</div></div></label>';
  });
  if (p.notes) out += '<div class="notpicked">' + esc(p.notes) + '</div>';
  if ((JOB.rejected || []).length)
    out += '<div class="warn">' + esc(JOB.rejected.join('; ')) + '</div>';
  out += '<div class="row"><button id="doupd">Apply</button>' +
         '<button id="cancel" class="linkish">Discard</button></div>';
  todayShell(out);
  $('cancel').onclick = () => { JOB = null; renderToday(); };
  $('doupd').onclick = async () => {
    const accept = Array.from(document.querySelectorAll('#today input[type=checkbox]'))
                        .filter(c => c.checked).map(c => Number(c.value));
    todayShell('<p class="spin">Applying…</p>');
    try {
      const r = await fetch('/plan/apply', {method:'POST',
        headers:Object.assign({'Content-Type':'application/json'}, H),
        body: JSON.stringify({job: JOB.id, accept: accept})});
      if (!r.ok) throw new Error(await r.text());
      JOB = null; CACHE.board = null; renderToday();
    } catch (e) {
      todayShell('<p class="empty">could not apply — ' + esc(e.message) + '</p>');
    }
  };
}

</script>
