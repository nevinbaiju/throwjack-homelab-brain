<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0E1115; --surface:#151A21; --raise:#1C222B;
    --ink:#E3E8F0; --ink-2:#9CA6B6; --ink-3:#6E7889;
    --rule:#262E39; --accent:#7FB3DB; --accent-ink:#0E1115;
    --signal:#DD8A4E; --ok:#74B893;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ground:#F1F3F7; --surface:#FFFFFF; --raise:#E8ECF3;
      --ink:#12161C; --ink-2:#4C5666; --ink-3:#6E7889;
      --rule:#D2D8E2; --accent:#17486B; --accent-ink:#FFFFFF;
      --signal:#A84C1B; --ok:#2C6247;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;padding-inline:20px;
       padding-block:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-bottom))}
  .wrap{width:100%;max-width:720px;margin-inline:auto;display:flex;flex-direction:column;
        flex:1;min-height:0;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--cond);font-weight:700;font-size:1.5rem;letter-spacing:-.01em;margin:0}
  .hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .modes{display:flex;gap:2px;background:var(--raise);padding:3px;border-radius:8px;
         border:1px solid var(--rule);width:fit-content}
  .modes button{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;padding:7px 14px;border:0;border-radius:6px;cursor:pointer;
    background:transparent;color:var(--ink-2)}
  .modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .modes button:focus-visible,textarea:focus-visible,#send:focus-visible,#slug:focus-visible{
    outline:2px solid var(--signal);outline-offset:2px}
  #slugrow{display:none;gap:8px;align-items:center}
  #slugrow.on{display:flex}
  #slugrow label{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  #slug{flex:1;min-width:0;font-family:var(--mono);font-size:14px;padding:8px 10px;
    background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:6px}
  textarea{flex:1;min-height:180px;resize:none;width:100%;padding:16px;
    background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;
    font-family:var(--sans);font-size:17px;line-height:1.55}
  textarea::placeholder{color:var(--ink-3)}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #send{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;padding:11px 22px;border:0;border-radius:8px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink)}
  #send[disabled]{opacity:.5;cursor:default}
  #status{font-family:var(--mono);font-size:12.5px;color:var(--ok);min-height:1.2em;
    opacity:0;transition:opacity .18s}
  #status.show{opacity:1}
  #status.err{color:var(--signal)}
  #recent{border-top:1px solid var(--rule);padding-top:10px;margin:0;list-style:none;
    font-family:var(--mono);font-size:12px;color:var(--ink-3);
    max-height:22vh;overflow-y:auto}
  .linkish{background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-decoration:underline}
  .linkish:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  #recent li{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Board */
  #board{display:none;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:18px}
  #board.on{display:flex}
  .lane h2{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .lane h2 .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .lane ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);
    border:1px solid var(--rule);border-radius:9px}
  .task.pin{border-color:var(--signal)}
  .task.gone{opacity:.35}
  .tick{appearance:none;flex:none;width:17px;height:17px;margin-top:2px;cursor:pointer;
    border:1.5px solid var(--ink-3);border-radius:5px;background:transparent}
  .tick:checked{background:var(--ok);border-color:var(--ok)}
  .tick:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .task .body{min-width:0;flex:1}
  .task .t{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
  .task.done-row .t{text-decoration:line-through;color:var(--ink-3)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;
    display:flex;gap:10px;flex-wrap:wrap}
  .meta .p1{color:var(--signal);font-weight:500}
  .acts{display:flex;gap:4px;flex:none}
  .acts button{font-family:var(--mono);font-size:10.5px;padding:3px 7px;cursor:pointer;
    background:var(--raise);color:var(--ink-2);border:1px solid var(--rule);border-radius:5px}
  .acts button:hover{color:var(--ink)}
  .acts button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .empty{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:2px 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Brain</h1>
    <span class="hint"><span id="kbd">⌘↵ to send</span> ·
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="linkish">sign out</button>
      </form></span>
  </header>

  <div class="modes" role="tablist">
    <button role="tab" id="m-file" aria-selected="true">File task</button>
    <button role="tab" id="m-plan" aria-selected="false">Plan task</button>
    <button role="tab" id="m-board" aria-selected="false">Board</button>
  </div>

  <div id="slugrow">
    <label for="slug">project</label>
    <input id="slug" list="slugs" placeholder="doordash" autocomplete="off" autocapitalize="off" spellcheck="false">
    <datalist id="slugs"></datalist>
  </div>

  <textarea id="text" autofocus
    placeholder="One thing. It lands on disk before anything reads it."></textarea>

  <div class="bar">
    <button id="send">Send</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <ul id="recent" aria-label="recent captures"></ul>
  <div id="board" aria-label="board"></div>
</div>

<script>
// No token here: the signed session cookie authenticates these fetches,
// and it is httponly so this script cannot read or leak it.
const H = {};
const $ = id => document.getElementById(id);
let mode = 'file';

$('kbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘↵ to send' : 'Ctrl+↵ to send';

function setMode(next){
  mode = next;
  const board = next === 'board';
  $('m-file').setAttribute('aria-selected', next === 'file');
  $('m-plan').setAttribute('aria-selected', next === 'plan');
  $('m-board').setAttribute('aria-selected', board);
  $('slugrow').classList.toggle('on', next === 'plan');
  // The composer and the board share the column; only one is ever present.
  for (const id of ['text','recent']) $(id).style.display = board ? 'none' : '';
  document.querySelector('.bar').style.display = board ? 'none' : '';
  $('board').classList.toggle('on', board);
  if (board){ loadBoard(); return; }
  $('text').placeholder = next === 'plan'
    ? 'Everything you know about this project. Messy is fine — it gets broken into ordered steps, and your raw text is kept verbatim.'
    : 'One thing. It lands on disk before anything reads it.';
  $('text').focus();
}
$('m-file').onclick = () => setMode('file');
$('m-plan').onclick = () => setMode('plan');
$('m-board').onclick = () => setMode('board');

const LANE_LABEL = {in_progress:'In progress', backlog:'Backlog', waiting:'Waiting', done:'Done'};

function esc(t){ const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

function metaLine(t){
  const bits = [];
  if (t.pinned) bits.push('<span class="p1">P0</span>');
  else if (t.priority === 1) bits.push('<span class="p1">!!!</span>');
  if (t.project) bits.push(esc(t.project));
  if (t.estimate_min) bits.push(esc(t.estimate_min) + 'm');
  if (t.due) bits.push('due ' + esc(t.due));
  if (t.why) bits.push(esc(t.why));
  return bits.join('<span aria-hidden="true">·</span>');
}

async function act(id, verb, li){
  li.classList.add('gone');                       // optimistic; reverted on failure
  try{
    const r = await fetch('/task/' + encodeURIComponent(id) + '/' + verb, {method:'POST', headers:H});
    if(!r.ok) throw new Error(r.status);
    say(verb === 'done' ? 'done' : verb);
    loadBoard();
  }catch(e){
    li.classList.remove('gone');
    const tick = li.querySelector('.tick');
    if (tick) tick.checked = false;
    say('could not update — ' + e.message, true);
  }
}

async function loadBoard(){
  let data;
  try{
    const r = await fetch('/board.json', {headers:H});
    if(!r.ok) throw new Error(r.status);
    data = await r.json();
  }catch(e){ $('board').innerHTML = '<p class="empty">could not load the board — ' + esc(e.message) + '</p>'; return; }

  const out = [];
  for (const lane of data.order){
    const items = data.lanes[lane] || [];
    if (!items.length && lane !== 'in_progress') continue;   // in progress is worth showing empty
    out.push('<section class="lane"><h2>' + esc(LANE_LABEL[lane] || lane) +
             '<span class="n">' + items.length + '</span></h2><ul>');
    if (!items.length) out.push('<li class="empty">nothing here</li>');
    for (const t of items){
      const isDone = lane === 'done';
      out.push(
        '<li class="task' + (t.pinned ? ' pin' : '') + (isDone ? ' done-row' : '') + '" data-id="' + esc(t.id) + '">' +
          '<input class="tick" type="checkbox" ' + (isDone ? 'checked disabled' : '') +
            ' aria-label="complete ' + esc(t.title) + '">' +
          '<div class="body"><div class="t">' + esc(t.title) + '</div>' +
            '<div class="meta">' + metaLine(t) + '</div></div>' +
          (isDone ? '' :
            '<div class="acts">' +
              (lane === 'in_progress' ? '' : '<button data-verb="doing" title="move to In progress">start</button>') +
              (lane === 'waiting' ? '' : '<button data-verb="blocked" title="move to Waiting">wait</button>') +
              '<button data-verb="drop" title="archive">drop</button>' +
            '</div>') +
        '</li>');
    }
    out.push('</ul></section>');
  }
  $('board').innerHTML = out.join('');

  $('board').querySelectorAll('.task').forEach(li => {
    const id = li.dataset.id;
    const tick = li.querySelector('.tick');
    if (tick && !tick.disabled) tick.onchange = () => tick.checked && act(id, 'done', li);
    li.querySelectorAll('.acts button').forEach(b => { b.onclick = () => act(id, b.dataset.verb, li); });
  });
}

function say(msg, bad){
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('err', !!bad);
  s.classList.add('show');
  clearTimeout(say.t);
  say.t = setTimeout(() => s.classList.remove('show'), 2600);
}

async function loadRecent(){
  try{
    const r = await fetch('/inbox/today', {headers: H});
    if(r.status === 401 || r.redirected){ location.href = '/login'; return; }
    if(!r.ok) return;
    const lines = (await r.text()).trim().split('\n').filter(l => l.trim() && !l.startsWith('nothing'));
    $('recent').innerHTML = lines.slice(-6).reverse()
      .map(l => '<li>' + l.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</li>').join('');
  }catch(e){}
}

async function loadProjects(){
  try{
    const r = await fetch('/projects', {headers: H});
    if(!r.ok) return;
    const slugs = await r.json();
    $('slugs').innerHTML = slugs.map(s => '<option value="' + s + '">').join('');
  }catch(e){}
}

async function send(){
  const body = $('text').value.trim();
  if(!body) return;
  const slug = $('slug').value.trim();
  if(mode === 'plan' && !slug){ say('name the project first', true); $('slug').focus(); return; }

  // Clear immediately. Reading a confirmation is where the next thought dies.
  $('text').value = '';
  $('text').focus();
  $('send').disabled = true;

  const url = mode === 'plan' ? '/project/' + encodeURIComponent(slug) + '/dump' : '/capture';
  if(mode === 'plan') say('planning… this takes up to a minute');

  try{
    const r = await fetch(url, {method:'POST', headers:{...H, 'Content-Type':'text/plain'}, body});
    if(!r.ok) throw new Error(await r.text());
    if(mode === 'plan'){
      const d = await r.json();
      say('planned: ' + d.created + ' steps, ' + d.started + ' started');
      loadProjects();
    } else {
      say('caught');
      loadRecent();
    }
  }catch(e){
    // Never lose it: put the text back so you can retry or copy it out.
    $('text').value = body;
    say('failed — your text is still here', true);
  }finally{
    $('send').disabled = false;
  }
}

$('send').onclick = send;
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
});
loadRecent(); loadProjects();
</script>
