<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root{--ground:#0E1115;--surface:#151A21;--ink:#E3E8F0;--ink-3:#6E7889;--rule:#262E39;
        --accent:#7FB3DB;--accent-ink:#0E1115;--signal:#DD8A4E;
        --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
        --cond:"IBM Plex Sans Condensed",var(--sans);--mono:"IBM Plex Mono",ui-monospace,monospace}
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
        --ground:#F1F3F7;--surface:#FFFFFF;--ink:#12161C;--ink-3:#6E7889;--rule:#D2D8E2;
        --accent:#17486B;--accent-ink:#FFFFFF;--signal:#A84C1B}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
       background:var(--ground);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased}
  form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
  h1{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
  label{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);display:block;margin-bottom:4px}
  input{width:100%;padding:11px 12px;font-family:var(--sans);font-size:16px;
        background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px}
  button{margin-top:4px;padding:12px;border:0;border-radius:8px;cursor:pointer;
         font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.08em;
         text-transform:uppercase;background:var(--accent);color:var(--accent-ink)}
  input:focus-visible,button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .err{font-family:var(--mono);font-size:12px;color:var(--signal);min-height:1.2em}
</style>
<form method="post" action="/login">
  <h1>Brain</h1>
  <div class="err"><!--ERR--></div>
  <div>
    <label for="u">username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off"
           autocorrect="off" spellcheck="false" required autofocus>
  </div>
  <div>
    <label for="p">password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">Sign in</button>
</form>
